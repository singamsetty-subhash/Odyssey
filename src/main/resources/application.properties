# -------------------------------------------------------------------
# Database Configuration (MySQL)
# -------------------------------------------------------------------
# Supports MYSQL_URL or DB_URL environment variables with Railway / local fallbacks:
spring.datasource.url=${MYSQL_URL:${DB_URL:jdbc:mysql://interchange.proxy.rlwy.net:29627/railway}}
spring.datasource.username=${MYSQLUSER:${DB_USERNAME:root}}
spring.datasource.password=${MYSQLPASSWORD:${DB_PASSWORD:hOtdixFoveekpNyWOUXffSvrlzKKwBig}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Database connection pool (Configured to support 15 concurrent members)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:15}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Embedded Tomcat Concurrency (Allocates at least 15 live threads for 15 simultaneous users)
server.tomcat.threads.min-spare=15
server.tomcat.threads.max=100
server.tomcat.max-connections=200
server.tomcat.accept-count=50

# JPA / Hibernate Configuration (MySQL)
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Payment Screenshots ----
# Uploaded payment proofs are stored directly in the MySQL database (LONGBLOB)

# ---- Admin login ----
odyssey.admin.username=${ADMIN_USERNAME:finance}
odyssey.admin.password=${ADMIN_PASSWORD:Toinfinityandbeyond}

# ---- Server ----
# Render sets PORT; bind to it when present.
server.port=${PORT:8080}
# Required behind Render's proxy so redirects and HTTPS URLs are generated correctly.
server.forward-headers-strategy=framework

# Multipart File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Thymeleaf Template Cache (disable for instant updates)
spring.thymeleaf.cache=false

# Session Inactivity Timeout (30 minutes)
server.servlet.session.timeout=30m
